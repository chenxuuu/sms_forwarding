e">PDU decode · blacklist · concat</text><g fill="none" stroke="#22b8a6" stroke-linecap="round" stroke-width="2.2"><path d="M-11 10 v-5 a11 11 0 0 1 22 0 v5 l3 3 h-28 z" transform="translate(984,80)"/><path d="M-3 16 a4 4 0 0 0 6 0" transform="translate(984,80)"/></g><text x="984" y="112" class="ttl" text-anchor="middle">Notifications</text><g><rect width="200" height="16" x="884" y="124" rx="5" fill="#f0f8f7" stroke="#dcefeb"/><circle cx="892" cy="132" r="2.4" fill="#22b8a6"/><text x="900" y="135" class="row">Mail · DingTalk · Feishu · WeCom</text><rect width="200" height="16" x="884" y="144" rx="5" fill="#f0f8f7" stroke="#dcefeb"/><circle cx="892" cy="152" r="2.4" fill="#22b8a6"/><text x="900" y="155" class="row">Telegram · Bark · Gotify</text><rect width="200" height="16" x="884" y="164" rx="5" fill="#f0f8f7" stroke="#dcefeb"/><circle cx="892" cy="172" r="2.4" fill="#22b8a6"/><text x="900" y="175" class="row">Custom template · Webhook</text></g><path fill="#94a5c4" d="M266 123 L280 130 L266 137 Z"/><path fill="#94a5c4" d="M572 123 L586 130 L572 137 Z"/><path fill="#94a5c4" d="M858 123 L872 130 L858 137 Z"/><path id="a1" d="M182 130 H276" class="ln"/><path id="a2" d="M498 130 H582" class="ln"/><path id="a3" d="M802 130 H868" class="ln"/><circle r="3.6" class="pkt" opacity="0"><animateMotion calcMode="linear" dur="6s" keyPoints="0;1;1" keyTimes="0;0.233;1" repeatCount="indefinite"><mpath href="#a1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.21;0.245;1" dur="6s" repeatCount="indefinite"/></circle><circle r="3.6" class="pkt" opacity="0"><animateMotion begin="1.4s" calcMode="linear" dur="6s" keyPoints="0;1;1" keyTimes="0;0.233;1" repeatCount="indefinite"><mpath href="#a2"/></animateMotion><animate attributeName="opacity" begin="1.4s" values="0;1;1;0;0" keyTimes="0;0.02;0.21;0.245;1" dur="6s" repeatCount="indefinite"/></circle><circle r="3.6" class="pkt" opacity="0"><animateMotion begin="2.8s" calcMode="linear" dur="6s" keyPoints="0;1;1" keyTimes="0;0.233;1" repeatCount="indefinite"><mpath href="#a3"/></animateMotion><animate attributeName="opacity" begin="2.8s" values="0;1;1;0;0" keyTimes="0;0.02;0.21;0.245;1" dur="6s" repeatCount="indefinite"/></circle><text x="229" y="116" class="cap" text-anchor="middle">SMS<animate attributeName="fill" values="#8c99b3;#4f7cff;#8c99b3" keyTimes="0;0.06;0.24" dur="6s" repeatCount="indefinite"/></text><text x="540" y="116" class="cap" text-anchor="middle">UART<animate attributeName="fill" values="#8c99b3;#4f7cff;#8c99b3" keyTimes="0;0.06;0.24" dur="6s" begin="1.4s" repeatCount="indefinite"/></text><text x="835" y="116" class="cap" text-anchor="middle">WiFi<animate attributeName="fill" values="#8c99b3;#4f7cff;#8c99b3" keyTimes="0;0.06;0.24" dur="6s" begin="2.8s" repeatCount="indefinite"/></text><text x="560" y="220" class="cap" text-anchor="middle">SMS is decoded on the device; content goes only to the channels you configure — no third-party server</text></svg>