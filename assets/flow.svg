<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" aria-label="短信转发原理：SIM 或 eSIM 卡收到短信后由 4G 模组经 UART 交给 ESP32-C3，再通过 WiFi 推送到邮件与多种平台；eSIM 可以在网页上切卡、删卡，并用电脑上的 lpac 写卡" role="img" viewBox="0 0 1120 280"><defs><linearGradient id="acc" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="acc2" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#22c8c8"/></linearGradient><filter id="soft" width="150%" height="150%" x="-25%" y="-25%"><feDropShadow dx="0" dy="3" flood-color="#2b3a5b" flood-opacity=".1" stdDeviation="7"/></filter><marker id="arw" markerHeight="6.5" markerWidth="6.5" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c2cde0" d="M0 0 L10 5 L0 10 Z"/></marker><style>.bg{fill:#f7f9fd}.box{fill:#fff;stroke:#e2e8f2;stroke-width:1.5}.ttl{font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1d2740}.sub{font:12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#6b7a96}.cap{font:11.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#8c99b3;letter-spacing:.4px}.ln{stroke:#bccbe4;stroke-width:2;fill:none;stroke-dasharray:7 9;stroke-linecap:round}.pkt{fill:url(#acc2)}.esim{fill:#fbf8ff;stroke:#a78bfa;stroke-width:1.5;stroke-dasharray:5 5}.etxt{font:600 12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#7c3aed}</style></defs><rect width="1120" height="280" x="0" y="0" class="bg" rx="18"/><rect width="1118.5" height="278.5" x=".75" y=".75" fill="none" stroke="#e6ecf6" rx="17.5"/><g filter="url(#soft)"><rect width="156" height="128" x="24" y="66" class="box" rx="16"/><rect width="216" height="128" x="280" y="66" class="box" rx="16"/><rect width="214" height="128" x="586" y="66" class="box" rx="16"/><rect width="224" height="128" x="872" y="66" class="box" rx="16"/></g><g fill="none" stroke="#5b8cff" stroke-linecap="round" stroke-width="2.2"><path d="M102 96 v22"/><path d="M96 118 h12"/><path d="M92 92 a12 12 0 0 1 20 0" opacity=".55"/><path d="M86 86 a20 20 0 0 1 32 0" opacity=".3"/></g><text x="102" y="146" class="ttl" text-anchor="middle">运营商网络</text><text x="102" y="168" class="sub" text-anchor="middle">短信下发到 SIM 卡</text><g transform="translate(388,86)"><rect width="26" height="24" x="-13" y="-4" fill="none" stroke="#8b5cf6" stroke-width="2" rx="4"/><path stroke="#8b5cf6" stroke-linecap="round" stroke-width="2" d="M-13 2 h-4 M-13 8 h-4 M-13 14 h-4 M13 2 h4 M13 8 h4 M13 14 h4"/></g><text x="388" y="146" class="ttl" text-anchor="middle">ML307R 4G 模组</text><text x="388" y="168" class="sub" text-anchor="middle">AT 固件 · Nano SIM / eSIM · 4G 天线</text><g transform="translate(693,86)"><rect width="26" height="24" x="-13" y="-4" fill="none" stroke="#5b8cff" stroke-width="2" rx="4"/><rect width="10" height="10" x="-5" y="2" fill="none" stroke="#5b8cff" stroke-width="1.6" rx="2"/><path stroke="#5b8cff" stroke-linecap="round" stroke-width="2" d="M-13 2 h-4 M-13 8 h-4 M-13 14 h-4 M13 2 h4 M13 8 h4 M13 14 h4"/></g><text x="693" y="146" class="ttl" text-anchor="middle">ESP32-C3</text><text x="693" y="168" class="sub" text-anchor="middle">PDU 解码 · 长短信合并 · 黑名单</text><g fill="none" stroke="#22b8a6" stroke-linecap="round" stroke-width="2.2"><path d="M-11 10 v-5 a11 11 0 0 1 22 0 v5 l3 3 h-28 z" transform="translate(984,84)"/><path d="M-3 16 a4 4 0 0 0 6 0" transform="translate(984,84)"/></g><text x="984" y="144" class="ttl" text-anchor="middle">通知到达</text><text x="984" y="166" class="sub" text-anchor="middle">邮件 · 钉钉 · 飞书 · 微信</text><text x="984" y="183" class="sub" text-anchor="middle">Telegram · Bark · 自定义模板</text><path fill="#94a5c4" d="M266 123 L280 130 L266 137 Z"/><path fill="#94a5c4" d="M572 123 L586 130 L572 137 Z"/><path fill="#94a5c4" d="M858 123 L872 130 L858 137 Z"/><path id="a1" d="M182 130 H276" class="ln"/><path id="a2" d="M498 130 H582" class="ln"/><path id="a3" d="M802 130 H868" class="ln"/><circle r="3.4" class="pkt" opacity=".95"><animateMotion calcMode="linear" dur="2.2s" keyPoints="0;1" keyTimes="0;1" repeatCount="indefinite"><mpath href="#a1"/></animateMotion><animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0;1;1;0"/></circle><circle r="3.4" class="pkt" opacity=".95"><animateMotion begin="0.7s" dur="2.2s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion><animate attributeName="opacity" begin="0.7s" dur="2.2s" repeatCount="indefinite" values="0;1;1;0"/></circle><circle r="3.4" class="pkt" opacity=".95"><animateMotion begin="1.4s" dur="2.2s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion><animate attributeName="opacity" begin="1.4s" dur="2.2s" repeatCount="indefinite" values="0;1;1;0"/></circle><text x="229" y="116" class="cap" text-anchor="middle">短信</text><text x="540" y="116" class="cap" text-anchor="middle">UART</text><text x="835" y="116" class="cap" text-anchor="middle">WiFi</text><path d="M693 194 V207" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/><rect x="523" y="209" width="340" height="34" rx="17" class="esim"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/></rect><text x="693" y="231" class="etxt" text-anchor="middle">eSIM 管理 · 网页切卡 / 删卡 · 电脑 lpac 写卡</text><text x="560" y="266" class="cap" text-anchor="middle">短信在设备本地解析，收件内容只发往你自己配置的通道，不经过任何第三方服务器</text></svg>