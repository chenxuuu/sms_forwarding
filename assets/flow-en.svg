<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="236" aria-label="How it works: one eSIM switches between profiles (same card, different plans), the 4G modem hands each incoming SMS to the ESP32-C3 over UART, and the ESP32-C3 decodes it, runs keep-alive jobs, and pushes it over WiFi to email, IM and webhooks" role="img" viewBox="0 0 1120 236"><defs><linearGradient id="acc" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="acc2" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#22c8c8"/></linearGradient><filter id="soft" width="150%" height="150%" x="-25%" y="-25%"><feDropShadow dx="0" dy="3" flood-color="#2b3a5b" flood-opacity=".1" stdDeviation="7"/></filter><style>.bg{fill:#f7f9fd}.box{fill:#fff;stroke:#e2e8f2;stroke-width:1.5}.ttl{font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1d2740}.sub{font:12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#6b7a96}.cap{font:11.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#8c99b3;letter-spacing:.4px}.ln{stroke:#bccbe4;stroke-width:2;fill:none;stroke-dasharray:7 9;stroke-linecap:round}.pkt{fill:url(#acc2)}.sim{fill:#fbf9ff;stroke:#bcaaff;stroke-width:1.6}.espT{font:600 11px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#3f6ecb}.row{font:11px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#4f7c78}.simt{font:600 11.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#5b43b8}.simk{font:600 9.5px -apple-system,BlinkMacSy