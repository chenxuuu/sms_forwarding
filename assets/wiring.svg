<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" aria-label="接线图：ESP32-C3 与 ML307R-DC 共地，GPIO3 接模组 RX、GPIO4 接模组 TX、GPIO5 控制模组 EN、5V 供电" role="img" viewBox="0 0 1000 540"><defs><filter id="ws" width="150%" height="150%" x="-25%" y="-25%"><feDropShadow dx="0" dy="3" flood-color="#2b3a5b" flood-opacity=".09" stdDeviation="7"/></filter><style>.bg{fill:#f7f9fd}.board{fill:#fff;stroke:#dbe3f0;stroke-width:1.6}.bt{font:600 15px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#1d2740}.bs{font:11.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#8494ae}.pin{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#48587a}.lb{font:11.5px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#8c99b3}.warn{font:12px -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#a2703a}.wire{fill:none;stroke-width:2.2;stroke-linecap:round}</style></defs><rect width="1000" height="540" x="0" y="0" class="bg" rx="18"/><rect width="998.5" height="538.5" x=".75" y=".75" fill="none" stroke="#e6ecf6" rx="17.5"/><g filter="url(#ws)"><rect width="288" height="292" x="56" y="64" class="board" rx="14"/><rect width="288" height="292" x="656" y="64" class="board" rx="14"/></g><text x="200" y="98" class="bt" text-anchor="middle">ESP32-C3 SuperMini</text><text x="200" y="118" class="bs" text-anchor="middle">USB-C 烧录 + 供电 · 3.3V 逻辑</text><text x="800" y="98" class="bt" text-anchor="middle">ML307R-DC 核心板</text><text x="800" y="118" class="bs" text-anchor="middle">AT 固件 · 无需改动 · 5V 供电</text><g class="pin"><text x="328" y="164" text-anchor="end">GPIO5</text><text x="328" y="209" text-anchor="end">GPIO3</text><text x="328" y="254" text-anchor="end">GPIO4</text><text x="328" y="299" text-anchor="end">GND</text><text x="328" y="344" text-anchor="end">5V</text><text x="672" y="164">EN</text><text x="672" y="209">RX</text><text x="672" y="254">TX</text><text x="672" y="299">GND</text><text x="672" y="344">VCC</text></g><g fill="#c4d0e4"><circle cx="344" cy="160" r="3.2"/><circle cx="656" cy="160" r="3.2"/><circle cx="344" cy="205" r="3.2"/><circle cx="656" cy="205" r="3.2"/><circle cx="344" cy="250" r="3.2"/><circle cx="656" cy="250" r="3.2"/><circle cx="344" cy="295" r="3.2"/><circle cx="656" cy="295" r="3.2"/><circle cx="344" cy="340" r="3.2"/><circle cx="656" cy="340" r="3.2"/></g><path stroke="#e8a33d" d="M344 160 H656" class="wire"/><path id="wt" stroke="#2fae7e" d="M344 205 H656" class="wire"/><path id="wr" stroke="#2fae7e" d="M656 250 H344" class="wire"/><path stroke="#a9b6cc" d="M344 295 H656" class="wire"/><path stroke="#e0645e" d="M344 340 H656" class="wire"/><text x="500" y="150" class="lb" text-anchor="middle">模组电源使能</text><text x="500" y="195" class="lb" text-anchor="middle">设备发 AT 指令</text><text x="500" y="240" class="lb" text-anchor="middle">模组回 AT 响应</text><text x="500" y="285" class="lb" text-anchor="middle">务必共地</text><text x="500" y="330" class="lb" text-anchor="middle">5V 主供电</text><circle r="3.2" fill="#2fae7e"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#wt"/></animateMotion></circle><circle r="3.2" fill="#2fae7e"><animateMotion begin="1.3s" dur="2.6s" repeatCount="indefinite"><mpath href="#wr"/></animateMotion></circle><text x="200" y="380" class="bs" text-anchor="middle">USB-C 接电脑或 5V 电源</text><text x="800" y="380" class="bs" text-anchor="middle">Nano SIM 卡槽 + 4G FPC 天线</text><rect width="888" height="46" x="56" y="410" fill="#fff7ea" stroke="#f2ddc2" rx="12"/><path fill="none" stroke="#d99a4a" stroke-linejoin="round" stroke-width="1.8" d="M84 440 l9 -15 l9 15 z"/><path stroke="#d99a4a" stroke-linecap="round" stroke-width="1.8" d="M93 432 v5 M93 440.5 v.6"/><text x="116" y="437" class="warn">两块板必须共地；模组注册/发信时峰值电流可达 2A，请用 5V/2A 以上电源。</text><text x="116" y="452" class="warn">USB 口供电不足会导致模组反复重启（表现为一直搜不到网）。</text><text x="500" y="492" class="lb" text-anchor="middle">杜邦线 5 根即可完成接线；天线务必接上再上电，空载发射可能损坏模组</text></svg>