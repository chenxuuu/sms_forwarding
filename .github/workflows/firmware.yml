name: Build IDF Firmware

on:
  push:
    branches: [master]
    paths:
      - 'idf/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 计算固件版本号
        id: ver
        run: echo "value=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"

      - name: 选择可用的 ESP-IDF 镜像
        id: idf
        run: |
          for tag in v6.1.1 release-v6.1 latest; do
            if docker pull -q "espressif/idf:${tag}" >/dev/null 2>&1; then
              echo "image=espressif/idf:${tag}" >> "$GITHUB_OUTPUT"
              echo "使用镜像 espressif/idf:${tag}"
              exit 0
            fi
          done
          echo "没有拉到任何 ESP-IDF 镜像" >&2
          exit 1

      - name: 编译并生成合并固件 / OTA 包
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/idf \
            -e IDF_TARGET=esp32c3 \
            -e PROJECT_VER="${{ steps.ver.outputs.value }}" \
            "${{ steps.idf.outputs.image }}" \
            /bin/bash -lc 'idf.py build && \
              cp build/sms_forwarder.bin build/sms_forwarder-ota.bin && \
              python -m esptool --chip esp32c3 merge_bin \
                -o build/sms_forwarder-merged.bin \
                --flash_mode dio --flash_freq 80m --flash_size 4MB \
                0x0 build/bootloader/bootloader.bin \
                0x8000 build/partition_table/partition-table.bin \
                0x10000 build/ota_data_initial.bin \
                0x20000 build/sms_forwarder.bin'
          # build/ 是容器里 root 建的，runner 用户没有写权限，产物先复制到 dist/
          mkdir -p dist
          cp idf/build/sms_forwarder-merged.bin idf/build/sms_forwarder-ota.bin dist/
          ls -lh dist/

      - name: 生成版本清单 latest.json
        run: |
          cd dist
          sha=$(sha256sum sms_forwarder-ota.bin | cut -d' ' -f1)
          size=$(stat -c%s sms_forwarder-ota.bin)
          cat > latest.json <<EOF
          {
            "version": "${{ steps.ver.outputs.value }}",
            "url": "https://github.com/chenxuuu/sms_forwarding/releases/latest/download/sms_forwarder-ota.bin",
            "size": ${size},
            "sha256": "${sha}",
            "notes": "提交 ${{ github.sha }}"
          }
          EOF
          cat latest.json

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          # 标题必须正好是版本号：网页端直接读 GitHub API 的 name 字段判新旧
          name: ${{ steps.ver.outputs.value }}
          body: |
            版本 `${{ steps.ver.outputs.value }}` · 提交 `${{ github.sha }}`

            | 文件 | 用途 | 烧录方式 |
            |---|---|---|
            | `sms_forwarder-merged.bin` | 全新芯片 / 要清空配置 | 地址 `0x0`（ESP Launchpad） |
            | `sms_forwarder-ota.bin` | 已有设备网页升级 | 后台「固件升级」上传，**不要**用 merged 包 |
            | `latest.json` | 版本清单（浏览器检查失败时的手动兜底） | 不用管 |

            **从旧版本（单分区布局）升级**：第一次必须用 `idf.py flash` 或分段写
            `0x0/0x8000/0x20000`，**不要**用 merged 包覆盖 `0x0`——它会把 NVS 抹成 0xFF，配置全丢。
          files: |
            dist/sms_forwarder-merged.bin
            dist/sms_forwarder-ota.bin
            dist/latest.json
          fail_on_unmatched_files: true
