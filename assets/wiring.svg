<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="接线图：ESP32-C3 与 ML307R-DC 共地，GPIO3 接模组 RX、GPIO4 接模组 TX、GPIO5 控制模组 EN、5V 供电">
  <defs>
    <filter id="ws" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#2b3a5b" flood-opacity="0.09"/>
    </filter>
    <style>
      .bg{fill:#f7f9fd}
      .board{fill:#fff;stroke:#dbe3f0;stroke-width:1.6}
      .bt{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1d2740}
      .bs{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#8494ae}
      .pin{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#48587a}
      .lb{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#8c99b3}
      .warn{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#a2703a}
      .wire{fill:none;stroke-width:2.2;stroke-linecap:round}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="540" rx="18"/>
  <rect x="0.75" y="0.75" width="998.5" height="538.5" rx="17.5" fill="none" stroke="#e6ecf6"/>

  <!-- 开发板 -->
  <g filter="url(#ws)">
    <rect class="board" x="56" y="64" width="288" height="292" rx="14"/>
    <rect class="board" x="656" y="64" width="288" height="292" rx="14"/>
  </g>

  <text class="bt" x="200" y="98" text-anchor="middle">ESP32-C3 SuperMini</text>
  <text class="bs" x="200" y="118" text-anchor="middle">USB-C 烧录 + 供电 · 3.3V 逻辑</text>

  <text class="bt" x="800" y="98" text-anchor="middle">ML307R-DC 核心板</text>
  <text class="bs" x="800" y="118" text-anchor="middle">AT 固件 · 无需改动 · 5V 供电</text>

  <!-- 引脚 -->
  <g class="pin">
    <text x="328" y="164" text-anchor="end">GPIO5</text>
    <text x="328" y="209" text-anchor="end">GPIO3</text>
    <text x="328" y="254" text-anchor="end">GPIO4</text>
    <text x="328" y="299" text-anchor="end">GND</text>
    <text x="328" y="344" text-anchor="end">5V</text>

    <text x="672" y="164">EN</text>
    <text x="672" y="209">RX</text>
    <text x="672" y="254">TX</text>
    <text x="672" y="299">GND</text>
    <text x="672" y="344">VCC</text>
  </g>

  <!-- 焊点 -->
  <g fill="#c4d0e4">
    <circle cx="344" cy="160" r="3.2"/><circle cx="656" cy="160" r="3.2"/>
    <circle cx="344" cy="205" r="3.2"/><circle cx="656" cy="205" r="3.2"/>
    <circle cx="344" cy="250" r="3.2"/><circle cx="656" cy="250" r="3.2"/>
    <circle cx="344" cy="295" r="3.2"/><circle cx="656" cy="295" r="3.2"/>
    <circle cx="344" cy="340" r="3.2"/><circle cx="656" cy="340" r="3.2"/>
  </g>

  <!-- 连线 -->
  <path class="wire" stroke="#e8a33d" d="M344 160 H656"/>
  <path id="wt" class="wire" stroke="#2fae7e" d="M344 205 H656"/>
  <path id="wr" class="wire" stroke="#2fae7e" d="M656 250 H344"/>
  <path class="wire" stroke="#a9b6cc" d="M344 295 H656"/>
  <path class="wire" stroke="#e0645e" d="M344 340 H656"/>

  <text class="lb" x="500" y="150" text-anchor="middle">模组电源使能</text>
  <text class="lb" x="500" y="195" text-anchor="middle">设备发 AT 指令</text>
  <text class="lb" x="500" y="240" text-anchor="middle">模组回 AT 响应</text>
  <text class="lb" x="500" y="285" text-anchor="middle">务必共地</text>
  <text class="lb" x="500" y="330" text-anchor="middle">5V 主供电</text>

  <!-- 数据流动 -->
  <circle r="3.2" fill="#2fae7e">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#wt"/></animateMotion>
  </circle>
  <circle r="3.2" fill="#2fae7e">
    <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#wr"/></animateMotion>
  </circle>

  <!-- 板外说明 -->
  <text class="bs" x="200" y="380" text-anchor="middle">USB-C 接电脑或 5V 电源</text>
  <text class="bs" x="800" y="380" text-anchor="middle">Nano SIM 卡槽 + 4G FPC 天线</text>

  <!-- 提示条 -->
  <rect x="56" y="410" width="888" height="46" rx="12" fill="#fff7ea" stroke="#f2ddc2"/>
  <path d="M84 440 l9 -15 l9 15 z" fill="none" stroke="#d99a4a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M93 432 v5 M93 440.5 v.6" stroke="#d99a4a" stroke-width="1.8" stroke-linecap="round"/>
  <text class="warn" x="116" y="437">两块板必须共地；模组注册/发信时峰值电流可达 2A，请用 5V/2A 以上电源。</text>
  <text class="warn" x="116" y="452">USB 口供电不足会导致模组反复重启（表现为一直搜不到网）。</text>

  <!-- 步骤 -->
  <text class="lb" x="500" y="492" text-anchor="middle">杜邦线 5 根即可完成接线；天线务必接上再上电，空载发射可能损坏模组</text>
</svg>
